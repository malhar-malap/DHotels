services:
  db:
    image: mysql:8.0
    container_name: dhotels-mysql-db
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    # The app signs in as dhotels_app, which only has rights on dhotels_portal; root stays for admin work
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=dhotels_portal
      - MYSQL_USER=dhotels_app
      - MYSQL_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    volumes:
      - dhotels_mysql_data:/var/lib/mysql
      - ./database/dhotels_portal.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhotels-spring-backend
    restart: always
    # Loopback only: the public reaches the API through nginx (HTTPS); Docker would otherwise bypass the firewall
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    # Only the settings the app reads, so the MySQL root password never reaches this container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/dhotels_portal?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=dhotels_app
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-d@dhotels24.com}
      - SITE_URL=${SITE_URL:-https://dhotels24.com}
      - ENABLED_DEAL_TYPES=${ENABLED_DEAL_TYPES:-For Lease}
      - SEED_SAMPLE_USER=${SEED_SAMPLE_USER:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - ADMIN_MOBILE=${ADMIN_MOBILE:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://dhotels24.com}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    volumes:
      - ./backend/uploads:/app/uploads
    entrypoint: java -jar app.jar --spring.mail.properties.mail.smtp.ssl.enable=true --spring.mail.properties.mail.smtp.starttls.enable=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhotels-react-frontend
    restart: always
    # No published ports: the VPS front proxy (react-frontend, DHAcquisitions stack) owns 80/443 and
    # reaches this container over the shared dhotels_proxy network (see deploy/proxy/dhotels.conf)
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      - default
      - dhotels_proxy

volumes:
  dhotels_mysql_data:

networks:
  dhotels_proxy:
    external: true
