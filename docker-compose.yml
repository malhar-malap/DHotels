services:
  db:
    image: mysql:8.0
    container_name: dhotels-mysql-db
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      - MYSQL_DATABASE=dhotels_portal
    volumes:
      - dhotels_mysql_data:/var/lib/mysql
      - ./database/dhotels_portal.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhotels-spring-backend
    restart: always
    # Loopback only: the public reaches the API through nginx (HTTPS); Docker would otherwise bypass the firewall
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/dhotels_portal?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
    volumes:
      - ./backend/uploads:/app/uploads
    entrypoint: java -jar app.jar --spring.mail.properties.mail.smtp.ssl.enable=true --spring.mail.properties.mail.smtp.starttls.enable=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhotels-react-frontend
    restart: always
    # No published ports: the VPS front proxy (react-frontend, DHAcquisitions stack) owns 80/443 and
    # reaches this container over the shared dhotels_proxy network (see deploy/proxy/dhotels.conf)
    depends_on:
      - backend
    networks:
      - default
      - dhotels_proxy

volumes:
  dhotels_mysql_data:

networks:
  dhotels_proxy:
    external: true
