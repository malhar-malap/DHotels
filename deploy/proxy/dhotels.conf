# Front-proxy site for DHotels24.in. Mounted into the shared "react-frontend" nginx container (the
# DHAcquisitions stack owns ports 80/443 on the VPS) as /etc/nginx/conf.d/dhotels.conf.
# Only mount it once /etc/letsencrypt/live/dhotels24.in exists, or that nginx refuses to start and
# takes every site on the server down with it. deploy/enable-https.sh does this in the right order.

# Per-IP limits for sign-in/OTP and the public lead forms (the backend also locks an email after
# repeated wrong passwords). Zone names are prefixed so they can't clash with the other sites here.
limit_req_zone $binary_remote_addr zone=dhotels_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dhotels_forms:10m rate=5r/m;

server {
    listen 80;
    server_name dhotels24.in www.dhotels24.in;
    return 301 https://dhotels24.in$request_uri;
}

server {
    listen 443 ssl;
    server_name www.dhotels24.in;

    ssl_certificate /etc/letsencrypt/live/dhotels24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhotels24.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://dhotels24.in$request_uri;
}

server {
    listen 443 ssl;
    server_name dhotels24.in;

    ssl_certificate /etc/letsencrypt/live/dhotels24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhotels24.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Uploads are capped at 10MB per file by the backend
    client_max_body_size 20m;
    server_tokens off;

    # Resolved per request, so the other sites keep running even when the DHotels stack is down
    resolver 127.0.0.11 valid=30s;
    set $dhotels http://dhotels-react-frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    limit_req_status 429;

    location ~ ^/api/auth/(login|send-otp|verify-otp-register|forgot-password|reset-password|refresh-token|check-availability) {
        limit_req zone=dhotels_auth burst=20 nodelay;
        proxy_pass $dhotels;
    }

    location ~ ^/api/(contact|consultations|mandates)/ {
        limit_req zone=dhotels_forms burst=5 nodelay;
        proxy_pass $dhotels;
    }

    location / {
        proxy_pass $dhotels;
    }
}
