# Front-proxy site for DHotels24.in. Mounted into the shared "react-frontend" nginx container (the
# DHAcquisitions stack owns ports 80/443 on the VPS) as /etc/nginx/conf.d/dhotels.conf.
# Only mount it once /etc/letsencrypt/live/dhotels24.in exists, or that nginx refuses to start and
# takes every site on the server down with it. deploy/enable-https.sh does this in the right order.

server {
    listen 80;
    server_name dhotels24.in www.dhotels24.in;
    return 301 https://dhotels24.in$request_uri;
}

server {
    listen 443 ssl;
    server_name www.dhotels24.in;

    ssl_certificate /etc/letsencrypt/live/dhotels24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhotels24.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://dhotels24.in$request_uri;
}

server {
    listen 443 ssl;
    server_name dhotels24.in;

    ssl_certificate /etc/letsencrypt/live/dhotels24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhotels24.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Uploads are capped at 10MB per file by the backend
    client_max_body_size 20m;

    location / {
        # Resolved per request, so the other sites keep running even when the DHotels stack is down
        resolver 127.0.0.11 valid=30s;
        set $dhotels http://dhotels-react-frontend:80;
        proxy_pass $dhotels;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
