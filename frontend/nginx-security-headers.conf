# Security headers, included at server level and in every location that sets its own
# add_header (nginx drops inherited add_header directives in such locations).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
# Scripts only from our origin, Google Analytics and Razorpay ('unsafe-inline' is needed for the
# inline bootstrap scripts in index.html); no plugins, no <base> hijacking, no framing by other sites.
add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.google-analytics.com https://checkout.razorpay.com https://*.razorpay.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
