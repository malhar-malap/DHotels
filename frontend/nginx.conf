server {
    listen 80;
    server_name dhotels24.in www.dhotels24.in;
    charset utf-8;
    
    # Redirect all HTTP traffic to HTTPS on the canonical (non-www) host in a single hop
    return 301 https://dhotels24.in$request_uri;
}

# Canonical host: permanently redirect www to the bare domain so search engines index one copy
server {
    listen 443 ssl;
    server_name www.dhotels24.in;

    ssl_certificate /etc/letsencrypt/live/dhotels24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhotels24.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://dhotels24.in$request_uri;
}

server {
    listen 443 ssl;
    server_name dhotels24.in;
    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    ssl_certificate /etc/letsencrypt/live/dhotels24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhotels24.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression for fast bundle delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Fingerprinted static bundles (JS, CSS, media) - long-term immutable caching
    # CRITICAL: Always return 404 for missing static files, never fall back to index.html!
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Sitemap is generated by the backend (all active listings & jobs); exact match beats the static regex below
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Public static media & metadata files (robots.txt, images, icons)
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|json|xml|txt)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA Entry Point & HTML routes:
    # Must NEVER be cached stale, ensuring browsers/bots always fetch latest bundle hashes
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Uploaded listing images live on the backend; bypass the static-file regex above.
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API responses include uploaded media URLs under /api/uploads/; bypass the static-file regex.
    location ^~ /api/ {
        # Route frontend API calls to Spring Boot backend
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
