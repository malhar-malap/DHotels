    <script>
      // Home page hero: start downloading the first photo right away instead of after the JS bundle runs.
      // Must match CATEGORIES[0].image and HERO_WIDTHS in src/utils/hospitality.js.
      if (location.pathname === '/') {
        var heroBase = 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&q=70&w=';
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.setAttribute('fetchpriority', 'high');
        heroPreload.setAttribute('imagesrcset', [640, 1080, 1600, 2000].map(function (w) { return heroBase + w + ' ' + w + 'w'; }).join(', '));
        heroPreload.setAttribute('imagesizes', '100vw');
        document.head.appendChild(heroPreload);
      }
    </script>
    <!-- Google tag (gtag.js) - loaded after the page has finished loading so it doesn't compete with the page itself.
         Calls made before then are queued in dataLayer and sent once it arrives. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Never send reset codes, emails or tokens from the address bar to analytics
      // (password-reset links carry ?email=...&otp=...)
      var gaLocation = location.origin + location.pathname;
      try {
        var gaUrl = new URL(location.href);
        ['otp', 'email', 'token', 'code'].forEach(function (k) { gaUrl.searchParams.delete(k); });
        gaLocation = gaUrl.toString();
      } catch (e) { /* keep the path-only fallback */ }
      gtag('config', 'G-BRX7CXG2P2', { page_location: gaLocation });

      window.addEventListener('load', function () {
        setTimeout(function () {
          var gtagScript = document.createElement('script');
          gtagScript.async = true;
          gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-BRX7CXG2P2';
          document.head.appendChild(gtagScript);
        }, 1500);
      });
    </script>
