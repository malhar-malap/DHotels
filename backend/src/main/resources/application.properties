# ============================================================
# DHotels24.com Portal Application Configuration
# ============================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.forward-headers-strategy=FRAMEWORK

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/dhotels_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# JWT Configuration
# No default: the app refuses to start without a JWT_SECRET of at least 32 characters (see .env.example)
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:d@dhotels24.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS Configuration
# localhost:8080/8082 are what the CRA dev proxy sends as Origin
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8082,http://localhost:5173,https://dhotels24.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept
cors.allow-credentials=true

# Application Settings
app.listing-expiry-days=90
app.max-images-per-listing=10
app.max-cv-size-mb=5
app.max-image-size-mb=5
app.base-url=http://localhost:8080/api
# Public frontend origin used in the sitemap
app.site-url=${SITE_URL:https://dhotels24.com}
# Inbox that receives contact, mandate and consultation notifications
app.notification-email=${NOTIFICATION_EMAIL:d@dhotels24.com}
# Seeds the sample accounts in DataInitializer (user, buyer, admin) on startup - local development only, never enable in production
app.seed-sample-user=${SEED_SAMPLE_USER:false}
# First production admin (AdminBootstrap): created once when no account has this email
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_INITIAL_PASSWORD:}
app.bootstrap-admin.mobile=${ADMIN_MOBILE:}

# Logging
logging.level.com.healthcare.portal=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# API docs (Swagger UI / OpenAPI) - disabled unless SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.company.name=DHotels24.com Marketplace

# Character Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
