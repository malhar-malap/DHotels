name: Security checks

# Runs on every push and pull request so new secrets, vulnerable dependencies or broken
# auth/authorization tests are caught before they reach the server.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full git history for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  frontend-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on high or critical advisories in production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --package-lock-only --audit-level=high

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests (including the security tests)
        working-directory: backend
        run: mvn -B test
