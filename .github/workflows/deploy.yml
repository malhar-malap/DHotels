name: Deploy DHotels

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Skip (instead of failing every push) until the VPS_* repository secrets are configured
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::VPS_HOST secret not set; skipping deploy"; fi

      - name: Deploy to VPS
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            cd /root/DHotels

            # backend/uploads holds user-uploaded files and is no longer tracked in git.
            # Back it up before pulling (a pull that untracks files deletes them) and restore after.
            # The backup is a fresh snapshot each deploy, so files deleted through the app aren't resurrected.
            UPLOADS_BACKUP=/root/dhotels-uploads-backup
            rm -rf "$UPLOADS_BACKUP"
            mkdir -p "$UPLOADS_BACKUP"
            if [ -d backend/uploads ]; then
              cp -a backend/uploads/. "$UPLOADS_BACKUP"/
            fi

            # Match GitHub exactly (works even after a history rewrite / force-push).
            # Untracked, git-ignored files such as .env and backend/uploads are left alone.
            git fetch origin main
            git reset --hard origin/main

            mkdir -p backend/uploads
            cp -a "$UPLOADS_BACKUP"/. backend/uploads/
            # The backend container runs as uid 10001 (see backend/Dockerfile)
            chown -R 10001:10001 backend/uploads

            docker compose up --build -d
