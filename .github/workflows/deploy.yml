name: Deploy DHotels

# Every push to main is tested, then pulled and rebuilt on the VPS by deploy/deploy.sh.
# A failing test stops the deploy, so the live site keeps running the last good version.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the running one to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false
      - name: Production build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Skip (instead of failing every push) until the VPS_* repository secrets are configured
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::VPS_HOST secret not set; skipping deploy"; fi

      # The key in VPS_SSH_KEY is pinned to deploy/deploy.sh on the server, so whatever is sent
      # here, the server only ever runs that script. VPS_KNOWN_HOSTS pins the server's host key.
      - name: Pull and rebuild on the VPS
        if: steps.secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$VPS_HOST" deploy
